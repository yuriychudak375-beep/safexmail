<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeXMail | Global Security Protocol</title>
    <style>
        body { background-color: #05070a; color: #e6edf3; font-family: 'Inter', -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #0d1117; padding: 45px; border-radius: 16px; border: 1px solid #30363d; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7); width: 100%; max-width: 400px; }
        .brand { font-size: 28px; font-weight: 800; color: #2f81f7; margin-bottom: 5px; letter-spacing: -1px; }
        .sub-brand { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; }
        .status-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1 { font-size: 18px; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #010409; color: white; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #238636; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 16px; transition: 0.2s; }
        button:hover { background: #2ea043; transform: translateY(-2px); }
        .result-critical { color: #ff7b72; background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; padding: 15px; border-radius: 8px; display: none; margin-top: 20px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">SafeX<span style="color: #f0f6fc;">Mail</span></div>
        <div class="sub-brand">Cybersecurity Shield</div>
        
        <div class="status-box">
            <h1>Перевірка на витоки (Дамп #XJ-2026)</h1>
            <input type="email" id="mail" placeholder="Введіть e-mail для сканування...">
            <button onclick="scan()">ПОЧАТИ СКАНУВАННЯ</button>
        </div>

        <div id="res" class="result-critical">
            <strong>КРИТИЧНА ЗАГРОЗА!</strong><br>
            Дані знайдено у відкритому доступі.<br>
            Необхідна активація SafeX-протоколу.
        </div>
    </div>

    <script>
        function scan() {
            const m = document.getElementById('mail').value;
            if(m.length > 5 && m.includes('@')) {
                document.getElementById('res').style.display = 'block';
            } else {
                alert('Будь ласка, введіть коректну пошту');
            }
        }
    </script>
</body>
</html>
